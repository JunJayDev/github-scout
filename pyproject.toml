[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "github-scout"
version = "0.2.0"
description = "Agent skill for Claude Code and Codex: before your agent builds something, find what GitHub already solved, keep the projects whose effect you can verify, and report the 2–3 to try first."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "github-scout contributors" }]
keywords = ["agents", "skills", "open-source", "github", "search", "reuse", "registry", "claude-code", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JunJayDev/github-scout"
Issues = "https://github.com/JunJayDev/github-scout/issues"
Changelog = "https://github.com/JunJayDev/github-scout/blob/main/CHANGELOG.md"

[project.scripts]
github-scout = "github_scout.cli:main"

[tool.setuptools]
package-dir = { "" = "skills/github-scout/scripts" }
packages = ["github_scout"]

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "B905"]
