[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reuse-first"
version = "0.1.0"
description = "Before building, find and vet existing open-source repos; record verdicts in a shared registry."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "reuse-first contributors" }]
keywords = ["agents", "skills", "open-source", "github", "search", "reuse", "registry", "claude-code", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]
dependencies = []

[project.scripts]
reuse-first = "reuse_first.cli:main"

[tool.setuptools]
package-dir = { "" = "skills/reuse-first/scripts" }
packages = ["reuse_first"]

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "B905"]
